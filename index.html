<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程题库 · 中转站</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #10161F; --surface: #182231; --surface-2: #1F2C3E; --text: #E8EEF7;
          --muted: #93A2B8; --accent: #4C9EEA; --border: #2C3A4E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
         line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; max-width: 760px; margin: 0 auto; padding: 40px 20px; width: 100%; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  .card { display: block; background: var(--surface); border: 1px solid var(--border);
          border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
          color: var(--text); text-decoration: none; transition: .15s; }
  .card:hover { border-color: var(--accent); background: var(--surface-2); }
  .card h2 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card .badge { display: inline-block; float: right; font-size: 12px; color: var(--muted);
                 border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center;
           padding: 16px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<main>
  <h1>课程题库 · 中转站</h1>
  <p class="sub">雨课堂 / 学习通课程题库，按章节分类，进度保存在本机浏览器</p>
  <div id="subjects"></div>
</main>
<footer>题库内容版权归课程方所有，仅供个人学习使用，禁止营利性使用</footer>
<script>
  // 新增科目：复制应用为 科目名/index.html，然后在这里加一行即可
  const SUBJECTS = [
    { name: '通信原理', path: './通信原理/index.html', count: 186,
      desc: '作业一~九 + 测试一/二，按 9 个章节分类，含正确答案与解析' },
    { name: '电磁场电磁波', path: './电磁场电磁波/index.html', count: 30,
      desc: '学习通测试一（单选 20 + 判断 10），按章节分类，公式图已内嵌' },
    { name: '数据通信与网络', path: './数据通信与网络/index.html', count: 362,
      desc: '作业 + 课后测试 + 课堂练习，含解析与错题本' },
  ];
  const box = document.getElementById('subjects');
  for (const s of SUBJECTS) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = s.path;
    a.innerHTML = '<h2>' + s.name +
      '<span class="badge">' + s.count + ' 题</span></h2><p>' + s.desc + '</p>';
    box.appendChild(a);
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
