<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="电磁场电磁波题库">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>电磁场电磁波 · 测试题库</title>
<style>
  :root {
    --bg: #10161F;
    --surface: #182231;
    --surface-2: #1F2C40;
    --border: #2A3850;
    --text: #E8EEF7;
    --muted: #93A3B8;
    --accent: #F2B453;
    --accent-dim: rgba(242, 180, 83, .12);
    --accent-text: #1A1206;
    --good: #4CC38A;
    --good-dim: rgba(76, 195, 138, .12);
    --bad: #E5696B;
    --bad-dim: rgba(229, 105, 107, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s, color .12s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .mono { font-family: Consolas, "JetBrains Mono", ui-monospace, monospace; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .hidden { display: none !important; }

  /* ---------- 首页 ---------- */
  .home-head { margin-bottom: 26px; }
  .home-title {
    font-size: 26px; font-weight: 700; letter-spacing: .02em; margin: 0 0 6px;
  }
  .home-sub { color: var(--muted); font-size: 13px; }
  .stack { margin: 0 0 22px; }
  .stack-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    margin-bottom: 6px;
  }
  .stack-bar.on { border-left-color: var(--accent); }
  .stack-label { display: flex; align-items: baseline; gap: 10px; }
  .stack-chapter { color: var(--muted); font-size: 12px; }
  .stack-chapter .mono { font-size: 12px; }
  .stack-name { font-weight: 600; }
  .stack-toggles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font-size: 12.5px; padding: 3px 10px; border-radius: 6px;
    color: var(--muted); border-color: var(--border); background: var(--surface-2);
  }
  .chip.on {
    color: var(--accent); border-color: var(--accent); background: var(--accent-dim);
  }
  .chip.partial { color: var(--accent); border-color: var(--border); background: var(--accent-dim); }
  .chip .mono { font-size: 11.5px; opacity: .8; }
  .chip-sel { font-size: 12px; padding: 3px 8px; border-radius: 6px; color: var(--muted); }

  /* ---------- 逐题选择页 ---------- */
  .user-input {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px;
    padding: 4px 10px; width: 200px; font-family: inherit;
  }
  .user-input:focus { outline: none; border-color: var(--accent); }
  #identChoices { display: flex; gap: 8px; flex-wrap: wrap; }
  #identChoices .back-btn { font-size: 12.5px; padding: 4px 10px; }
  .draw-label { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .draw-input { flex: none; width: 84px; text-align: center; }
  .draw-btn { flex: 1; max-width: 200px; padding: 9px; font-weight: 600; }
  .add-wrong-btn { color: var(--muted); font-size: 13px; padding: 5px 10px; margin-right: auto; }
  .add-wrong-btn:hover { color: var(--bad); border-color: var(--bad); }
  .pick-list { margin-bottom: 16px; }
  .pick-item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 12px; margin-bottom: 6px;
    cursor: pointer; font-size: 13.5px; line-height: 1.55;
  }
  .pick-item.on { border-color: var(--accent); }
  .pick-item input { margin-top: 4px; accent-color: var(--accent); }
  .pick-item .pick-num { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .pick-item .pick-text { color: var(--muted); }
  .picker-foot { position: sticky; bottom: 12px; }
  .picker-foot .start-btn { box-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
  .mode-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .mode-pick { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode-pick button { border: none; border-radius: 0; padding: 8px 18px; color: var(--muted); }
  .mode-pick button + button { border-left: 1px solid var(--border); }
  .mode-pick button.on { color: var(--accent); background: var(--accent-dim); }
  .pick-count { color: var(--muted); font-size: 13px; }
  .pick-count b { color: var(--accent); font-weight: 600; }
  .start-row { display: flex; gap: 12px; }
  .start-btn {
    flex: 1; background: var(--accent); border-color: var(--accent);
    color: var(--accent-text); font-size: 16px; font-weight: 700; padding: 13px;
  }
  .start-btn:hover { filter: brightness(1.06); border-color: var(--accent); }
  .led {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-text); margin-right: 8px; vertical-align: 2px;
    animation: led 2.2s ease-in-out infinite;
  }
  @keyframes led { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .led { animation: none; } }
  .wrong-btn { padding: 13px 18px; }
  .wrong-btn b { color: var(--bad); }

  /* ---------- 答题页 ---------- */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 10px;
  }
  .back-btn { color: var(--muted); font-size: 13px; padding: 5px 10px; }
  .quiz-meta { text-align: center; color: var(--muted); font-size: 12.5px; }
  .quiz-count { text-align: right; color: var(--muted); font-size: 13px; }
  .quiz-count b { color: var(--text); font-weight: 600; }
  .bar-track { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .q-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px 24px;
  }
  .q-index { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .q-index .mono { color: var(--accent); }
  .q-body { font-size: 16px; margin-bottom: 10px; }
  .q-img {
    display: block; max-width: 100%; margin: 0 0 16px;
    background: #fff; border-radius: 6px;
  }
  .opt {
    display: block; width: 100%; text-align: left;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 14.5px;
  }
  .opt .opt-key { color: var(--muted); margin-right: 8px; font-weight: 700; }
  .opt-img {
    vertical-align: middle; max-height: 2.6em; margin-left: 6px;
    background: #fff; border-radius: 3px; padding: 1px;
  }
  .opt:not(:disabled):hover { border-color: var(--accent); }
  .opt:disabled { opacity: 1; cursor: default; }
  .opt.right { border-color: var(--good); background: var(--good-dim); }
  .opt.right .opt-key { color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-dim); }
  .opt.wrong .opt-key { color: var(--bad); }
  .feedback { margin: 6px 0 14px; font-size: 14px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .explain {
    margin: 0 0 14px; padding: 10px 14px; text-align: left;
    background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--muted);
    line-height: 1.6;
  }
  .explain .explain-label { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .fill-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fill-label { color: var(--muted); font-size: 13px; min-width: 48px; }
  .fill-input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14.5px;
    padding: 9px 12px; font-family: inherit;
  }
  .fill-input:focus { outline: none; border-color: var(--accent); }
  .fill-input.right { border-color: var(--good); background: var(--good-dim); }
  .fill-input.wrong { border-color: var(--bad); background: var(--bad-dim); }
  .next-row { text-align: right; }
  .next-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; min-width: 110px; }
  .key-hint { color: var(--muted); font-size: 12px; margin-top: 14px; text-align: center; }

  /* ---------- 结果页 ---------- */
  .result-head { text-align: center; margin: 18px 0 8px; }
  .result-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .result-score { margin: 10px 0 26px; text-align: center; }
  .result-score .big { font-size: 44px; font-weight: 700; color: var(--accent); }
  .result-score .sub { color: var(--muted); font-size: 13px; }
  .wrong-list { margin-bottom: 26px; }
  .wrong-title { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .wrong-item {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--bad);
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px;
  }
  .wrong-item .wb { color: var(--muted); }
  .wrong-item .ans-bad { color: var(--bad); font-weight: 600; }
  .wrong-item .ans-good { color: var(--good); font-weight: 600; }
  .result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .result-btns .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 18px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 560px) {
    .stack-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
    .stack-toggles { justify-content: flex-start; }
    .q-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- 首页：选题 -->
  <section id="home">
    <header class="home-head">
      <h1 class="home-title">电磁场电磁波 · 测试题库</h1>
      <div class="home-sub">雨课堂题库导出 · 共 <span id="totalCount" class="mono"></span> 题 · 进度保存在本机</div>
      <div class="home-sub">题库内容来自课程 · 禁止营利性使用</div>
      <div class="home-sub">
        用户：
        <input class="user-input" id="userNameInput" placeholder="输入名字，进度互不影响" autocomplete="off">
        <button class="back-btn" id="switchUserBtn">确定</button>
      </div>
      <div class="home-sub hidden" id="identChoices"></div>
    </header>

    <div class="stack" id="stack"></div>

    <div class="mode-row">
      <div class="mode-pick" id="modePick">
        <button data-mode="seq" class="on">顺序</button>
        <button data-mode="rand">随机</button>
      </div>
      <div class="mode-pick" id="qmodePick">
        <button data-qmode="practice" class="on">练习</button>
        <button data-qmode="test">测试</button>
      </div>
      <button class="chip" id="optShuffleBtn" aria-pressed="false">选项乱序</button>
      <div class="pick-count">已选 <b id="pickCount" class="mono">0</b> 题</div>
    </div>

    <div class="mode-row hidden" id="drawRow">
      <div class="draw-label">随机抽题</div>
      <input class="fill-input draw-input mono" id="drawCount" type="number" min="1" value="10">
      <div class="draw-label">道</div>
      <button class="start-btn draw-btn" id="drawBtn">抽题测试</button>
    </div>

    <div class="start-row">
      <button class="start-btn" id="startBtn" disabled><span class="led"></span>开始练习</button>
      <button class="wrong-btn" id="wrongBookBtn">错题本 <b id="wrongCount" class="mono"></b></button>
    </div>
  </section>

  <!-- 逐题选择页 -->
  <section id="picker" class="hidden">
    <div class="quiz-top">
      <button class="back-btn" id="pickerBackBtn">← 返回</button>
      <div class="quiz-meta" id="pickerTitle"></div>
      <button class="back-btn" id="pickerToggleBtn">全选</button>
    </div>
    <div class="pick-list" id="pickList"></div>
    <div class="start-row picker-foot">
      <button class="start-btn" id="pickerDoneBtn"><span class="led"></span>完成选择</button>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="quiz" class="hidden">
    <div class="quiz-top">
      <button class="back-btn" id="backBtn">← 返回选题</button>
      <div class="quiz-meta" id="quizMeta"></div>
      <div class="quiz-count"><b id="quizPos" class="mono"></b></div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="q-card">
      <div class="q-index"><span class="mono" id="qNo"></span> · <span id="qType"></span></div>
      <div class="q-body" id="qBody"></div>
      <div id="opts"></div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="next-row">
        <button class="add-wrong-btn hidden" id="addWrongBtn">加入错题</button>
        <button class="next-btn hidden" id="nextBtn">下一题</button>
      </div>
      <div class="key-hint">键盘 1–6 选答 · 回车下一题</div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="result" class="hidden">
    <div class="result-head"><div class="result-title" id="resultTitle"></div></div>
    <div class="result-score">
      <div class="big mono" id="resultPct"></div>
      <div class="sub" id="resultSub"></div>
    </div>
    <div class="wrong-list hidden" id="wrongListWrap">
      <p class="wrong-title">错题回顾</p>
      <div id="wrongList"></div>
    </div>
    <div class="result-btns">
      <button class="primary" id="againBtn">再练一遍</button>
      <button id="onlyWrongBtn">只练错题</button>
      <button id="homeBtn">返回选题</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

const STORE_KEY = 'ykt-practice-v1';

/* ---------- 数据整理 ---------- */
function qid(q) { return q.sheet + '|' + q.index; }
const SHEET_ORDER = [];
const BY_SHEET = {};
for (const q of DATA) {
  if (!BY_SHEET[q.sheet]) { BY_SHEET[q.sheet] = []; SHEET_ORDER.push(q.sheet); }
  BY_SHEET[q.sheet].push(q);
}

/* 章节分组：按章号归并，无章号的归入课堂练习 */
const CARD_ALIAS = {
  '2022-第1章-时延--练习题': '第1章 时延',
  '2023-第3章最小帧长-练习题': '第3章 最小帧长',
  '2022-第3章CRC-练习题': '第3章 CRC',
  '2021-TCP序号-练习题': 'TCP 序号',
  '2024-运输层-流量控制-练习题': '运输层 流量控制'
};
const CHAPTERS = [];
for (const s of SHEET_ORDER) {
  const m = s.match(/^(第\d+章)\s*(.*?)(?:作业|课后测试题)/)
         || s.match(/^(第\d+章)\s*(.+)$/);
  const chapter = m ? m[1] : '课堂练习';
  const title = m ? (m[2] || '').trim() : '课堂练习';
  let c = CHAPTERS.find(x => x.chapter === chapter);
  if (!c) { c = { chapter, title, sheets: [] }; CHAPTERS.push(c); }
  else if (c.title === '' && title !== '') { c.title = title; }
  c.sheets.push(s);
}

/* ---------- 存储：身份 = 名字#4位随机码，键用哈希加盐 ---------- */
const USER_KEY = 'ykt-current-user';
const IDX_KEY = 'ykt-idx';
const SALT = 'ykt-2026';
function hashKey(s) {
  let h = 0x811c9dc5;
  const str = s + '|' + SALT;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return ('0000000' + (h >>> 0).toString(16)).slice(-8);
}
function baseOf(id) { return (id || '').split('#')[0]; }
let idx = {};
try { idx = JSON.parse(localStorage.getItem(IDX_KEY) || '{}'); } catch (e) { idx = {}; }
function saveIdx() { localStorage.setItem(IDX_KEY, JSON.stringify(idx)); }
function storeKey(id) { return STORE_KEY + ':p:' + hashKey(id); }

function migrateLegacy() {
  const moved = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(STORE_KEY + ':') || k.startsWith(STORE_KEY + ':p:')) continue;
    const name = k.slice((STORE_KEY + ':').length);
    if (!name) continue;
    const code = Math.random().toString(36).slice(2, 6);
    const newId = name + '#' + code;
    localStorage.setItem(storeKey(newId), localStorage.getItem(k));
    localStorage.removeItem(k);
    moved[name] = newId;
  }
  const names = Object.keys(moved);
  if (names.length && !localStorage.getItem(USER_KEY)) {
    localStorage.setItem(USER_KEY, moved[names[0]]);
  }
}
migrateLegacy();
let userName = localStorage.getItem(USER_KEY) || '';

let store = {};
function loadStore() {
  store = {};
  try { store = JSON.parse(localStorage.getItem(storeKey(userName)) || '{}'); } catch (e) { store = {}; }
  if (!store.wrong) store.wrong = {};
  // 旧版错题格式 1 → {count: 0}
  for (const k of Object.keys(store.wrong)) {
    if (typeof store.wrong[k] !== 'object') store.wrong[k] = { count: 0 };
  }
}
function saveStore() { localStorage.setItem(storeKey(userName), JSON.stringify(store)); }

/* ---------- 登录 ---------- */
function applyUser(id) {
  userName = id;
  localStorage.setItem(USER_KEY, id);
  const b = baseOf(id);
  if (!idx[b]) idx[b] = [];
  if (!idx[b].includes(id)) idx[b].push(id);
  saveIdx();
  $('identChoices').classList.add('hidden');
  loadStore();
  sel = {};
  if (store.sel) {
    for (const [s, idxs] of Object.entries(store.sel)) sel[s] = new Set(idxs);
  }
  renderHome();
  $('userNameInput').value = userName;
}
function renderIdentChoices(name, list) {
  const box = $('identChoices');
  box.innerHTML = '';
  box.classList.remove('hidden');
  for (const id of list) {
    const b = document.createElement('button');
    b.className = 'back-btn';
    b.textContent = '进入 ' + id;
    b.addEventListener('click', () => applyUser(id));
    box.appendChild(b);
  }
  const nb = document.createElement('button');
  nb.className = 'back-btn';
  nb.textContent = '我是新人，新建身份';
  nb.addEventListener('click', () => {
    applyUser(name + '#' + Math.random().toString(36).slice(2, 6));
    toast('新身份已创建，请记住：' + userName);
  });
  box.appendChild(nb);
}
function login(input) {
  const name = (input || '').trim();
  if (!name) { toast('输入名字'); return; }
  if (name.includes('#')) {
    applyUser(name);
    return;
  }
  const list = idx[name] || [];
  if (!list.length) {
    applyUser(name + '#' + Math.random().toString(36).slice(2, 6));
    toast('新身份已创建，请记住：' + userName);
    return;
  }
  if (list.length === 1) {
    applyUser(list[0]);
    return;
  }
  renderIdentChoices(name, list);
}
loadStore();

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 选题集合 ---------- */
function selCount() {
  return Object.values(sel).reduce((s, set) => s + set.size, 0);
}
function sheetSelState(s) {
  const set = sel[s];
  if (!set || set.size === 0) return 'off';
  return set.size === BY_SHEET[s].length ? 'on' : 'partial';
}
function toggleWholeSheet(s) {
  const state = sheetSelState(s);
  if (state === 'on') delete sel[s];
  else sel[s] = new Set(BY_SHEET[s].map(q => q.index));
  saveStore();
  updatePickCount();
  refreshChip(s);
}
function refreshChip(s) {
  const chip = document.querySelector('.chip[data-sheet="' + s + '"]');
  if (!chip) return;
  const state = sheetSelState(s);
  chip.classList.remove('on', 'partial');
  if (state !== 'off') chip.classList.add(state);
  chip.setAttribute('aria-pressed', state !== 'off');
  chip.closest('.stack-bar').classList.toggle(
    'on', chip.closest('.stack-bar').querySelectorAll('.chip.on, .chip.partial').length > 0);
}

/* ---------- 首页 ---------- */
function renderHome() {
  $('totalCount').textContent = DATA.length;
  $('userNameInput').value = userName || '';
  const stackEl = $('stack');
  stackEl.innerHTML = '';
  for (const c of CHAPTERS) {
    const bar = document.createElement('div');
    bar.className = 'stack-bar';
    const label = document.createElement('div');
    label.className = 'stack-label';
    const chap = document.createElement('span');
    chap.className = 'stack-chapter';
    chap.innerHTML = '<span class="mono">' + c.chapter + '</span>';
    const nm = document.createElement('span');
    nm.className = 'stack-name';
    nm.textContent = c.title;
    label.appendChild(chap); label.appendChild(nm);
    const toggles = document.createElement('div');
    toggles.className = 'stack-toggles';
    for (const s of c.sheets) {
      const n = BY_SHEET[s].length;
      const sub = CARD_ALIAS[s] || s.replace(/^第\d+章\s*/, '') || (s.includes('课后测试') ? '课后测试' : '作业');
      const wrap = document.createElement('span');
      wrap.style.display = 'inline-flex';
      wrap.style.gap = '4px';
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.sheet = s;
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = sub + ' <span class="mono">' + n + '</span>';
      b.addEventListener('click', () => toggleWholeSheet(s));
      const pick = document.createElement('button');
      pick.className = 'chip-sel';
      pick.textContent = '选题';
      pick.title = '逐题选择';
      pick.addEventListener('click', () => openPicker(s));
      wrap.appendChild(b); wrap.appendChild(pick);
      toggles.appendChild(wrap);
    }
    bar.appendChild(label); bar.appendChild(toggles);
    stackEl.appendChild(bar);
  }
  if (store.sel) {
    sel = {};
    for (const [s, idxs] of Object.entries(store.sel)) {
      sel[s] = new Set(idxs);
    }
  }
  for (const s of SHEET_ORDER) refreshChip(s);
  if (store.mode === 'rand') setMode('rand');
  if (store.qmode === 'test') setQmode('test');
  if (store.optShuffle) {
    optShuffle = true;
    $('optShuffleBtn').classList.add('on');
    $('optShuffleBtn').setAttribute('aria-pressed', 'true');
  }
  updatePickCount();
  $('wrongCount').textContent = Object.keys(store.wrong).length || '';
}

function updatePickCount() {
  const n = selCount();
  $('pickCount').textContent = n;
  $('startBtn').disabled = n === 0;
  $('startBtn').innerHTML = '<span class="led"></span>' +
    (qmode === 'test' ? '开始测试' : '开始练习');
  const dc = $('drawCount');
  dc.max = n;
  if (Number(dc.value) > n && n > 0) dc.value = Math.min(10, n);
  $('drawBtn').disabled = n === 0;
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modePick button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m));
}
function setQmode(m) {
  qmode = m;
  document.querySelectorAll('#qmodePick button').forEach(b =>
    b.classList.toggle('on', b.dataset.qmode === m));
  $('drawRow').classList.toggle('hidden', m !== 'test');
  updatePickCount();
}
$('modePick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setMode(b.dataset.mode);
});
$('qmodePick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setQmode(b.dataset.qmode);
});
$('optShuffleBtn').addEventListener('click', () => {
  optShuffle = !optShuffle;
  $('optShuffleBtn').classList.toggle('on', optShuffle);
  $('optShuffleBtn').setAttribute('aria-pressed', optShuffle);
  store.optShuffle = optShuffle; saveStore();
});
$('switchUserBtn').addEventListener('click', () => {
  login($('userNameInput').value);
});
$('userNameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') login($('userNameInput').value);
});
$('drawBtn').addEventListener('click', () => {
  if (!selCount()) { toast('请先选题'); return; }
  const n = Math.max(1, Math.min(Number($('drawCount').value) || 1, selCount()));
  const pool = [];
  for (const s of SHEET_ORDER) {
    const set = sel[s];
    if (!set || !set.size) continue;
    for (const q of BY_SHEET[s]) {
      if (set.has(q.index)) pool.push(q);
    }
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  quiz = pool.slice(0, n);
  beginQuizScreen();
});

/* ---------- 逐题选择页 ---------- */
function openPicker(sheet) {
  pickerMode = sheet;
  $('home').classList.add('hidden');
  $('picker').classList.remove('hidden');
  $('pickerTitle').textContent = sheet === 'wrong' ? '错题本' : sheet;
  renderPickList();
}
function pickerQuestions() {
  if (pickerMode === 'wrong') {
    return DATA.filter(q => store.wrong[qid(q)]);
  }
  return BY_SHEET[pickerMode] || [];
}
function renderPickList() {
  const list = $('pickList');
  list.innerHTML = '';
  const qs = pickerQuestions();
  if (!qs.length) {
    const empty = document.createElement('div');
    empty.className = 'pick-item';
    empty.style.cursor = 'default';
    empty.innerHTML = '<span class="pick-text">还没有错题</span>';
    list.appendChild(empty);
    $('pickerToggleBtn').textContent = '全选';
    return;
  }
  const allOn = qs.every(q => (sel[q.sheet] || new Set()).has(q.index));
  $('pickerToggleBtn').textContent = allOn ? '全不选' : '全选';
  for (const q of qs) {
    const row = document.createElement('div');
    row.className = 'pick-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = (sel[q.sheet] || new Set()).has(q.index);
    cb.addEventListener('change', () => {
      if (cb.checked) {
        if (!sel[q.sheet]) sel[q.sheet] = new Set();
        sel[q.sheet].add(q.index);
      } else if (sel[q.sheet]) {
        sel[q.sheet].delete(q.index);
        if (!sel[q.sheet].size) delete sel[q.sheet];
      }
      row.classList.toggle('on', cb.checked);
      saveStore();
      if (pickerMode !== 'wrong') refreshChip(q.sheet);
    });
    row.addEventListener('click', e => {
      if (e.target !== cb) cb.click();
    });
    const num = document.createElement('span');
    num.className = 'pick-num mono';
    num.textContent = q.index + '.';
    const txt = document.createElement('span');
    txt.className = 'pick-text';
    txt.textContent = (q.body || '').slice(0, 42);
    row.appendChild(cb); row.appendChild(num); row.appendChild(txt);
    row.classList.toggle('on', cb.checked);
    list.appendChild(row);
  }
}
$('pickerToggleBtn').addEventListener('click', () => {
  const qs = pickerQuestions();
  if (!qs.length) return;
  const allOn = qs.every(q => (sel[q.sheet] || new Set()).has(q.index));
  for (const q of qs) {
    if (allOn) {
      if (sel[q.sheet]) sel[q.sheet].delete(q.index);
      if (sel[q.sheet] && !sel[q.sheet].size) delete sel[q.sheet];
    } else {
      if (!sel[q.sheet]) sel[q.sheet] = new Set();
      sel[q.sheet].add(q.index);
    }
  }
  saveStore();
  if (pickerMode !== 'wrong') refreshChip(pickerMode);
  renderPickList();
});
$('pickerBackBtn').addEventListener('click', () => {
  $('picker').classList.add('hidden');
  $('home').classList.remove('hidden');
  updatePickCount();
});
$('pickerDoneBtn').addEventListener('click', () => {
  $('picker').classList.add('hidden');
  $('home').classList.remove('hidden');
  updatePickCount();
});

/* ---------- 出题 ---------- */
function buildQuizFromSel(shuffle) {
  quiz = [];
  for (const s of SHEET_ORDER) {
    const set = sel[s];
    if (!set || !set.size) continue;
    for (const q of BY_SHEET[s]) {
      if (set.has(q.index)) quiz.push(q);
    }
  }
  if (shuffle) {
    for (let i = quiz.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [quiz[i], quiz[j]] = [quiz[j], quiz[i]];
    }
  }
}

function beginQuizScreen() {
  if (!quiz.length) { toast('没有题目'); return; }
  pos = 0; correctCount = 0; sessionAnswers = {}; sessionOrig = {};
  $('home').classList.add('hidden');
  $('picker').classList.add('hidden');
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQuestion();
}

function startQuiz(shuffle) {
  buildQuizFromSel(shuffle);
  beginQuizScreen();
}

$('startBtn').addEventListener('click', () => {
  if (!selCount()) { toast('请先选题'); return; }
  store.sel = {};
  for (const [s, set] of Object.entries(sel)) store.sel[s] = [...set];
  store.mode = mode; store.qmode = qmode; saveStore();
  startQuiz(mode === 'rand');
});
$('wrongBookBtn').addEventListener('click', () => {
  if (!Object.keys(store.wrong).length) { toast('还没有错题'); return; }
  openPicker('wrong');
});

/* ---------- 答题 ---------- */
function renderQuestion() {
  const q = quiz[pos];
  judged = false;
  $('quizMeta').textContent = q.sheet;
  $('quizPos').textContent = (pos + 1) + ' / ' + quiz.length;
  $('barFill').style.width = ((pos) / quiz.length * 100) + '%';
  $('qNo').textContent = '第 ' + q.index + ' 题';
  $('qType').textContent = q.type;
  $('qBody').textContent = q.body;
  document.querySelectorAll('.q-img').forEach(el => el.remove());
  if (q.images && q.images.length) {
    for (const src of q.images) {
      const img = document.createElement('img');
      img.className = 'q-img';
      img.src = src;
      img.alt = '题目图片';
      $('qBody').insertAdjacentElement('afterend', img);
    }
  }
  const optsEl = $('opts');
  optsEl.innerHTML = '';
  if (q.type === '填空题') {
    const n = Array.isArray(q.answer) ? q.answer.length : 0;
    for (let i = 0; i < n; i++) {
      const row = document.createElement('div');
      row.className = 'fill-row';
      const lab = document.createElement('span');
      lab.className = 'fill-label';
      lab.textContent = '填空' + (i + 1);
      const inp = document.createElement('input');
      inp.className = 'fill-input';
      inp.type = 'text';
      inp.autocomplete = 'off';
      inp.spellcheck = false;
      inp.dataset.i = i;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(); });
      row.appendChild(lab); row.appendChild(inp);
      optsEl.appendChild(row);
    }
    optsEl.querySelector('.fill-input').focus();
  } else {
    let opts = q.options.map(o => Object.assign({}, o));
    let ansKey = q.answer;
    if (optShuffle) {
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      const KEYS = 'ABCDEFGH';
      const idx = opts.findIndex(o => o.key === q.answer);
      opts = opts.map((o, i) => Object.assign({}, o, { key: KEYS[i], orig: o.key }));
      if (idx >= 0) ansKey = KEYS[idx];
    }
    curAnswer = ansKey;
    curOpts = opts;
    opts.forEach((o, i) => {
      const key = o.key || String(i);
      const b = document.createElement('button');
      b.className = 'opt';
      b.dataset.key = key;
      b.innerHTML = '<span class="opt-key">' + key + '</span>' + escapeHtml(o.text || '');
      if (o.images && o.images.length) {
        for (const src of o.images) {
          b.innerHTML += '<img class="opt-img" src="' + src + '" alt="">';
        }
      }
      b.addEventListener('click', () => choose(key));
      optsEl.appendChild(b);
    });
  }
  $('feedback').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
  $('addWrongBtn').classList.add('hidden');
  const ex = document.getElementById('explainBox');
  if (ex) ex.remove();
  const hint = document.querySelector('.key-hint');
  hint.textContent = q.type === '填空题'
    ? '输入答案后回车提交 · 再回车下一题'
    : '键盘 1–6 选答 · 回车下一题';
  window.scrollTo(0, 0);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showExplain(q) {
  if (!q.explain) return;
  const div = document.createElement('div');
  div.className = 'explain';
  div.id = 'explainBox';
  div.innerHTML = '<span class="explain-label">解析</span>' + escapeHtml(q.explain);
  const nextRow = $('nextBtn').closest('.next-row');
  nextRow.insertAdjacentElement('beforebegin', div);
}

function finishJudge(ok, correctText) {
  const id = qid(quiz[pos]);
  if (ok) {
    correctCount++;
    if (store.wrong[id]) {
      store.wrong[id].count = (store.wrong[id].count || 0) + 1;
      if (store.wrong[id].count >= 3) {
        delete store.wrong[id];
        toast('连续 3 次答对，已移出错题本');
      }
    }
  } else {
    store.wrong[id] = { count: 0 };
  }
  saveStore();
  $('barFill').style.width = ((pos + 1) / quiz.length * 100) + '%';
  if (qmode === 'test') {
    if (pos + 1 < quiz.length) { pos++; renderQuestion(); }
    else showResult();
    return;
  }
  const fb = $('feedback');
  fb.classList.remove('hidden', 'good', 'bad');
  if (ok) {
    fb.textContent = '回答正确';
    fb.classList.add('good');
  } else {
    fb.textContent = '回答错误，正确答案：' + correctText;
    fb.classList.add('bad');
  }
  showExplain(quiz[pos]);
  $('addWrongBtn').classList.toggle('hidden',
    qmode !== 'practice' || !!store.wrong[id]);
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = pos + 1 < quiz.length ? '下一题' : '查看结果';
}

function choose(key) {
  if (judged) return;
  judged = true;
  const q = quiz[pos];
  sessionAnswers[qid(q)] = key;
  const opt = curOpts.find(o => o.key === key);
  sessionOrig[qid(q)] = opt ? (opt.orig || opt.key) : key;
  const ok = key === curAnswer;
  if (qmode !== 'test') {
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.key === curAnswer) b.classList.add('right');
    });
    if (!ok) {
      document.querySelector('.opt[data-key="' + key + '"]').classList.add('wrong');
    }
  }
  finishJudge(ok, curAnswer);
}

function submitFill() {
  if (judged) return;
  const q = quiz[pos];
  const inputs = document.querySelectorAll('.fill-input');
  if (!inputs.length) return;
  let ok = true;
  const given = [];
  const correct = [];
  inputs.forEach(inp => {
    const i = Number(inp.dataset.i);
    const val = inp.value.trim();
    given.push(val);
    const accepts = Array.isArray(q.answer) ? (q.answer[i] || []) : [];
    correct.push(accepts.join('/'));
    const hit = accepts.some(a => String(a).trim().toLowerCase() === val.toLowerCase());
    if (qmode !== 'test') {
      inp.disabled = true;
      if (hit) inp.classList.add('right');
      else { ok = false; inp.classList.add('wrong'); }
    } else if (!hit) {
      ok = false;
    }
  });
  judged = true;
  sessionAnswers[qid(q)] = given.join(';');
  finishJudge(ok, correct.join('；'));
}

function next() {
  if (!judged) return;
  if (pos + 1 < quiz.length) { pos++; renderQuestion(); }
  else showResult();
}
$('nextBtn').addEventListener('click', next);
$('addWrongBtn').addEventListener('click', () => {
  const id = qid(quiz[pos]);
  store.wrong[id] = { count: 0 };
  saveStore();
  $('addWrongBtn').classList.add('hidden');
  toast('已加入错题本');
});

/* ---------- 结果 ---------- */
function showResult() {
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  const total = quiz.length;
  const pct = Math.round(correctCount / total * 100);
  $('resultTitle').textContent = qmode === 'test' ? '测试完成' : '练习完成';
  $('resultPct').textContent = pct + '%';
  $('resultSub').textContent = '答对 ' + correctCount + ' / ' + total + ' 题';
  const wrongQs = quiz.filter(q => store.wrong[qid(q)]);
  const ww = $('wrongListWrap'), wl = $('wrongList');
  if (wrongQs.length) {
    ww.classList.remove('hidden');
    wl.innerHTML = '';
    for (const q of wrongQs) {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      let htmlStr = '<span class="mono">' + q.index + '.</span> ' + escapeHtml(q.body) +
        '<br><span class="wb">你的答案 </span><span class="ans-bad">' + escapeHtml(pickedOf(q)) +
        '</span><span class="wb"> · 正确答案 </span><span class="ans-good">' + escapeHtml(q.answer) + '</span>';
      if (q.explain) {
        htmlStr += '<br><span class="wb">解析 </span>' + escapeHtml(q.explain);
      }
      div.innerHTML = htmlStr;
      wl.appendChild(div);
    }
  } else {
    ww.classList.add('hidden');
  }
}

function pickedOf(q) {
  return sessionOrig[qid(q)] || sessionAnswers[qid(q)] || '未作答';
}
$('againBtn').addEventListener('click', () => {
  startQuiz(mode === 'rand');
});
$('onlyWrongBtn').addEventListener('click', () => {
  if (!Object.keys(store.wrong).length) { toast('没有错题'); return; }
  $('result').classList.add('hidden');
  openPicker('wrong');
});
$('homeBtn').addEventListener('click', goHome);
$('backBtn').addEventListener('click', goHome);

function goHome() {
  $('quiz').classList.add('hidden');
  $('result').classList.add('hidden');
  $('picker').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('wrongCount').textContent = Object.keys(store.wrong).length || '';
  updatePickCount();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  if (!judged && /^[1-6]$/.test(e.key) && e.target.tagName !== 'INPUT') {
    const idx = Number(e.key) - 1;
    const b = document.querySelectorAll('.opt')[idx];
    if (b && !b.disabled) choose(b.dataset.key);
  } else if (e.key === 'Enter' && judged && e.target.tagName !== 'INPUT') {
    next();
  }
});

renderHome();

/* 离线缓存：仅在 http/https 下注册，file:// 打开时自动跳过 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
